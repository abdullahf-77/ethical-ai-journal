# Per-domain search query templates for paper discovery.
#
# Keyed by the 7 consolidated top domains (taxonomy_version: v2, see
# ../taxonomy/taxonomy_v2_7domains.json). Each domain's queries are built from
# that domain's actual member-domain / subdomain vocabulary (see
# taxonomy/taxonomy_v2_7domains.json -> top_domains[].domains[].subdomains[]),
# NOT a single generic keyword list reused across domains.
#
# `queries` are plain keyword strings passed as-is to each discovery source's
# search parameter (arXiv `search_query`, Semantic Scholar `query`, OpenAlex
# `search`, Crossref `query`). Sources handle their own query-syntax quirks;
# this file only owns *what* to search for, not *how* each API wants it
# formatted.

template_version: v1
taxonomy_version: v2

domains:
  TD1:
    name: "Human Rights, Fairness & Dignity"
    queries:
      - "artificial intelligence algorithmic fairness"
      - "AI bias mitigation machine learning"
      - "AI human rights"
      - "AI non-discrimination protected attributes"
      - "AI human dignity ethics"
      - "algorithmic bias detection fairness metrics"
      - "AI diversity inclusion accessibility"
      - "facial recognition bias demographic disparity"
      - "biometric categorization discrimination AI"
      - "AI social scoring democratic values"
      - "fairness aware machine learning"
      - "AI remedy redress contestability"

